apiVersion: v1
kind: Namespace
metadata:
  name: ci-platform
  labels:
    lab-owner: portfolio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry
  namespace: ci-platform
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: &id001
      app: telemetry
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: telemetry
        image: ci-telemetry:dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: GITLAB_URL
          value: https://gitlab.com
        - name: GITLAB_PROJECT_IDS
          value: '1'
        - name: GITLAB_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitlab-api
              key: token
        - name: ENVIRONMENT
          value: ci-platform
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 4
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id001
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry
  namespace: ci-platform
  labels:
    observe: app
spec:
  selector:
    app: telemetry
  ports:
  - name: http
    port: 8080
    targetPort: http
