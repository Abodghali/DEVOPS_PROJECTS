apiVersion: v1
kind: Namespace
metadata:
  name: build-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: context
  namespace: build-lab
data:
  Dockerfile: 'FROM busybox:1.37

    COPY hello.txt /hello.txt

    CMD ["cat", "/hello.txt"]

    '
  hello.txt: 'Internal build workload

    '
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: build-output
  namespace: build-lab
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: build-image
  namespace: build-lab
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
      - name: build
        image: moby/buildkit:v0.23.2-rootless
        command:
        - buildctl-daemonless.sh
        - build
        - --frontend
        - dockerfile.v0
        - --local
        - context=/workspace
        - --local
        - dockerfile=/workspace
        - --output
        - type=oci,dest=/output/image.tar
        env:
        - name: BUILDKITD_FLAGS
          value: --oci-worker-no-process-sandbox
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: Unconfined
          appArmorProfile:
            type: Unconfined
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        volumeMounts:
        - name: context
          mountPath: /workspace
          readOnly: true
        - name: output
          mountPath: /output
      volumes:
      - name: context
        configMap:
          name: context
      - name: output
        persistentVolumeClaim:
          claimName: build-output
