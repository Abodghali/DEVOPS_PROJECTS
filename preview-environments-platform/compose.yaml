name: preview-environments-platform
services:
  app:
    build:
      context: .
      args:
        SERVICE: app
    image: preview-environments-platform-app:dev
    environment:
      REVIEW_ID: local
      ENVIRONMENT: review-local
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz',timeout=4)
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
    - 127.0.0.1:8095:8080
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
    - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 127.0.0.1:9094:9090
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run scripts/init-secrets.sh}
    volumes:
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
    - 127.0.0.1:3013:3000
volumes: {}
