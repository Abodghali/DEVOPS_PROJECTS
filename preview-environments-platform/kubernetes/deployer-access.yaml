apiVersion: v1
kind: Namespace
metadata:
  name: preview-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-PROJECT_ID
  namespace: preview-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preview-PROJECT_ID
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  verbs:
  - get
  - list
  - create
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - services
  - resourcequotas
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
  - patch
  - update
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - get
  - list
  - create
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preview-PROJECT_ID
subjects:
- kind: ServiceAccount
  name: preview-PROJECT_ID
  namespace: preview-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-PROJECT_ID
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: preview-PROJECT_ID-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - '*'
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      - DELETE
      - CONNECT
      resources:
      - '*'
      - '*/*'
  validations:
  - expression: 'request.userInfo.username != ''system:serviceaccount:preview-system:preview-PROJECT_ID''
      || (request.resource.resource == ''namespaces'' ? (request.operation == ''DELETE''
      ? oldObject.metadata.name : object.metadata.name) : request.namespace).matches(''^review-PROJECT_ID-[1-9][0-9]*$'')'
    message: Preview identity may mutate only its own review namespaces.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: preview-PROJECT_ID-boundary
spec:
  policyName: preview-PROJECT_ID-boundary
  validationActions:
  - Deny
