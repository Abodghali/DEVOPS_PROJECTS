apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: microservices
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: &id001
      app: redis
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis:7.4-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: redis
          containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        command:
        - sh
        - -c
        - exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping
          periodSeconds: 5
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id001
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: microservices
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  namespace: microservices
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: products-db
  namespace: microservices
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: database-user
  affinity:
    podAntiAffinityType: required
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      max_connections: '40'
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store
  namespace: microservices
spec:
  ingressClassName: traefik
  rules:
  - host: store.lab.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8080
