stages:
- test
- build
- scan
- deploy
unit:
  stage: test
  image: python:3.13-slim
  script:
  - pip install -r requirements.txt PyYAML==6.0.2
  - python -m unittest discover -s tests -v
  - python -m compileall -q app scripts tests
  - for file in scripts/*.sh; do bash -n "$file" || exit 1; done
  rules: &id001
  - if: $CI_PIPELINE_SOURCE != "schedule"
  tags:
  - docker-build
infrastructure:
  stage: test
  image:
    name: hashicorp/terraform:1.11.4
    entrypoint:
    - ''
  script:
  - terraform -chdir=terraform init -backend=false
  - terraform -chdir=terraform validate
  rules: *id001
  tags:
  - docker-build
ansible:
  stage: test
  image: python:3.13-slim
  script:
  - pip install ansible-core==2.18.6
  - ansible-playbook -i ansible/inventory.ini.example ansible/playbook.yml --syntax-check
  rules: *id001
  tags:
  - docker-build
integration:
  stage: build
  image: docker:28.3.3-cli
  tags:
  - docker-build
  services:
  - name: docker:28.3.3-dind
    alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: /certs/client
  before_script:
  - apk add --no-cache bash openssl
  rules:
  - if: $CI_PIPELINE_SOURCE != "schedule"
  script:
  - bash scripts/init-secrets.sh
  - docker compose up -d --build --wait --wait-timeout 240
  - bash scripts/smoke.sh
  after_script:
  - docker compose logs --tail=30
  - docker compose down -v
build:
  stage: build
  image: docker:28.3.3-cli
  tags:
  - docker-build
  services:
  - name: docker:28.3.3-dind
    alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: /certs/client
  before_script:
  - apk add --no-cache bash openssl
  rules:
  - if: $CI_PIPELINE_SOURCE != "schedule"
  parallel:
    matrix:
    - SERVICE:
      - frontend
      - gateway
      - catalog
      - inventory
      - pricing
  script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER"
    --password-stdin
  - docker build --build-arg SERVICE="$SERVICE" -t "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA"
    .
  - docker push "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA"
scan:
  stage: scan
  image:
    name: aquasec/trivy:0.66.0
    entrypoint:
    - ''
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
  - trivy image --exit-code 1 --severity HIGH,CRITICAL "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA"
  rules: *id001
  parallel:
    matrix:
    - SERVICE:
      - frontend
      - gateway
      - catalog
      - inventory
      - pricing
  tags:
  - docker-build
deploy:
  stage: deploy
  tags:
  - platform-deploy
  resource_group: ha-microservices-platform
  environment:
    name: lab
  script:
  - export KUBECONFIG="$KUBE_CONFIG"
  - export IMAGE_BASE="$CI_REGISTRY_IMAGE" RELEASE="$CI_COMMIT_SHA"
  - bash scripts/deploy.sh
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    when: manual
