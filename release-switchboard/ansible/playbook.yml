---
- name: Prepare the release-switchboard Kubernetes host
  hosts: k3s
  become: true
  vars:
    k3s_version: v1.34.1+k3s1
  tasks:
    - name: Install host utilities
      ansible.builtin.apt:
        name: [curl, ca-certificates]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0700'
    - name: Configure server
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: '0600'
        content: |
          write-kubeconfig-mode: "0600"
          disable:
            - traefik
            - servicelb
          cluster-cidr: 10.52.0.0/16
          service-cidr: 10.53.0.0/16
      notify: Restart k3s
    - name: Download installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/src/install-k3s.sh
        mode: '0700'
    - name: Install pinned K3s version on first provisioning
      ansible.builtin.command: /usr/local/src/install-k3s.sh
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: '{{ k3s_version }}'
    - name: Enable K3s
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        state: started
    - name: Apply changed server configuration
      ansible.builtin.meta: flush_handlers
    - name: Wait for API health
      ansible.builtin.command: k3s kubectl get --raw=/readyz
      register: api_health
      changed_when: false
      retries: 20
      delay: 6
      until: api_health.rc == 0
  handlers:
    - name: Restart k3s
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
