stages: [test, build, deploy]
unit:
  stage: test
  image: python:3.13-slim
  script:
    - python -m unittest discover -s tests -v
    - python -m compileall -q app tests
    - for file in scripts/*.sh; do bash -n "$file" || exit 1; done
infrastructure:
  stage: test
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: ['']
  script:
    - terraform -chdir=terraform fmt -check
    - terraform -chdir=terraform init -backend=false
    - terraform -chdir=terraform validate
ansible:
  stage: test
  image: python:3.13-slim
  script:
    - pip install ansible-core==2.18.6
    - ansible-playbook -i ansible/inventory.ini.example ansible/playbook.yml --syntax-check
build:
  stage: build
  image: docker:28.3.3-cli
  services:
    - name: docker:28.3.3-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - apk add --no-cache bash
  script:
    - bash scripts/smoke.sh
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker tag release-switchboard:dev "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  after_script:
    - docker compose logs --tail=30
    - docker compose down -v
deploy:
  stage: deploy
  tags: [release-switchboard-deploy]
  resource_group: release-switchboard-staging
  environment:
    name: staging
  script:
    - export KUBECONFIG="$KUBE_CONFIG"
    - export IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - bash scripts/deploy.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
