name: saas-environment-platform
services:
  app-dev:
    build:
      context: .
      args:
        SERVICE: app
    image: saas-environment-platform-app:dev
    environment:
      ENVIRONMENT: dev
      API_TOKEN: ${API_TOKEN_DEV:?Run scripts/init-secrets.sh}
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz',timeout=4)
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
    - 127.0.0.1:8090:8080
  app-staging:
    build:
      context: .
      args:
        SERVICE: app
    image: saas-environment-platform-app:dev
    environment:
      ENVIRONMENT: staging
      API_TOKEN: ${API_TOKEN_STAGING:?Run scripts/init-secrets.sh}
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz',timeout=4)
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
    - 127.0.0.1:8091:8080
  app-production:
    build:
      context: .
      args:
        SERVICE: app
    image: saas-environment-platform-app:dev
    environment:
      ENVIRONMENT: production
      API_TOKEN: ${API_TOKEN_PRODUCTION:?Run scripts/init-secrets.sh}
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz',timeout=4)
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
    - 127.0.0.1:8092:8080
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
    - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 127.0.0.1:9091:9090
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run scripts/init-secrets.sh}
    volumes:
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
    - 127.0.0.1:3010:3000
volumes: {}
