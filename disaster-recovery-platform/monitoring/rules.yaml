apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: disaster-recovery-platform
  namespace: monitoring
spec:
  groups:
  - name: disaster-recovery-platform
    rules:
    - alert: ApplicationErrors
      expr: sum by (namespace) (rate(lab_requests_total{status=~"5.."}[5m])) > 0.1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: Application requests are failing
    - alert: PodRestarting
      expr: increase(kube_pod_container_status_restarts_total[10m]) > 2
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: A pod restarted repeatedly
    - alert: BackupTooOld
      expr: (time() - dr_last_backup_timestamp_seconds > 900) or absent(dr_last_backup_timestamp_seconds)
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: No recent successful backup
    - alert: RecoveryDatabaseUnavailable
      expr: pg_up{namespace="dr-lab"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: Active PostgreSQL target is unavailable
    - alert: RecoveryStorageLow
      expr: kubelet_volume_stats_available_bytes{namespace="dr-lab"} / kubelet_volume_stats_capacity_bytes{namespace="dr-lab"}
        < 0.15
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: Recovery volume has less than 15 percent free space
    - alert: RecoveryJobFailed
      expr: kube_job_status_failed{namespace="dr-lab"} > 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: A recovery namespace Job failed
