apiVersion: v1
kind: ConfigMap
metadata:
  name: disaster-recovery-platform-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  project.json: '{"title": "disaster-recovery-platform", "uid": "disaster-recovery-platform",
    "schemaVersion": 39, "version": 1, "refresh": "15s", "time": {"from": "now-1h",
    "to": "now"}, "templating": {"list": [{"name": "environment", "type": "query",
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": "label_values(lab_requests_total,
    environment)", "includeAll": true, "allValue": ".*", "current": {"text": "All",
    "value": "$__all"}}, {"name": "namespace", "type": "query", "datasource": {"type":
    "prometheus", "uid": "prometheus"}, "query": "label_values(kube_pod_info, namespace)",
    "includeAll": true, "allValue": ".*", "current": {"text": "All", "value": "$__all"}}]},
    "panels": [{"id": 1, "title": "Request rate", "type": "timeseries", "datasource":
    {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 0, "w":
    12, "h": 8}, "targets": [{"expr": "sum(rate(lab_requests_total{environment=~\"$environment\"}[5m]))
    by (service,environment)", "refId": "A"}]}, {"id": 2, "title": "p95 latency",
    "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "targets": [{"expr": "histogram_quantile(0.95,sum(rate(lab_request_duration_seconds_bucket{environment=~\"$environment\"}[5m]))
    by (le,service,environment))", "refId": "A"}]}, {"id": 3, "title": "HTTP errors",
    "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "targets": [{"expr": "sum(rate(lab_requests_total{status=~\"5..\",environment=~\"$environment\"}[5m]))
    by (service)", "refId": "A"}]}, {"id": 4, "title": "Pod CPU", "type": "timeseries",
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12,
    "y": 8, "w": 12, "h": 8}, "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",container!=\"\"}[5m]))
    by (pod)", "refId": "A"}]}, {"id": 5, "title": "Pod memory", "type": "timeseries",
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0,
    "y": 16, "w": 12, "h": 8}, "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"\"})
    by (pod)", "refId": "A"}]}, {"id": 6, "title": "Pod restarts", "type": "timeseries",
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12,
    "y": 16, "w": 12, "h": 8}, "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[15m]))
    by (pod)", "refId": "A"}]}, {"id": 7, "title": "Backup age", "type": "timeseries",
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0,
    "y": 24, "w": 12, "h": 8}, "targets": [{"expr": "time() - dr_last_backup_timestamp_seconds",
    "refId": "A"}]}, {"id": 8, "title": "Failed jobs", "type": "timeseries", "datasource":
    {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 24, "w":
    12, "h": 8}, "targets": [{"expr": "sum(kube_job_status_failed{namespace=\"dr-lab\"})",
    "refId": "A"}]}, {"id": 9, "title": "Volume usage", "type": "timeseries", "datasource":
    {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 32, "w":
    12, "h": 8}, "targets": [{"expr": "kubelet_volume_stats_used_bytes{namespace=\"dr-lab\"}
    / kubelet_volume_stats_capacity_bytes{namespace=\"dr-lab\"}", "refId": "A"}]},
    {"id": 10, "title": "Database health", "type": "timeseries", "datasource": {"type":
    "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 32, "w": 12, "h":
    8}, "targets": [{"expr": "pg_up", "refId": "A"}]}, {"id": 11, "title": "Last recovery
    time", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "gridPos": {"x": 0, "y": 40, "w": 12, "h": 8}, "targets": [{"expr": "dr_last_rto_seconds",
    "refId": "A"}]}, {"id": 12, "title": "Last recovery point gap", "type": "timeseries",
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12,
    "y": 40, "w": 12, "h": 8}, "targets": [{"expr": "dr_last_rpo_seconds", "refId":
    "A"}]}]}'
