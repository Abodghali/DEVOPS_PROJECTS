apiVersion: v1
kind: Namespace
metadata:
  name: dr-lab
  labels:
    lab-owner: portfolio
---
apiVersion: v1
kind: Service
metadata:
  name: primary
  namespace: dr-lab
spec:
  selector:
    app: postgres
    slot: primary
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: primary
  namespace: dr-lab
spec:
  replicas: 1
  serviceName: primary
  selector:
    matchLabels:
      app: postgres
      slot: primary
  template:
    metadata:
      labels:
        app: postgres
        slot: primary
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: postgres:17.6-alpine
        env:
        - name: POSTGRES_DB
          value: app
        - name: POSTGRES_USER
          value: app
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - app
            - -d
            - app
          periodSeconds: 3
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: recovery
  namespace: dr-lab
spec:
  selector:
    app: postgres
    slot: recovery
  ports:
  - port: 5432
---
