---
apiVersion: v1
kind: Service
metadata:
  name: active-db
  namespace: dr-lab
spec:
  selector:
    app: postgres
    slot: primary
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  namespace: dr-lab
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: &id001
      app: notes
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: notes
        image: dr-notes:dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: PGHOST
          value: active-db
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: ENVIRONMENT
          value: dr-lab
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 4
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id001
---
apiVersion: v1
kind: Service
metadata:
  name: notes
  namespace: dr-lab
  labels:
    observe: app
spec:
  selector:
    app: notes
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: dr-lab
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: &id001
      app: pushgateway
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pushgateway
        image: prom/pushgateway:v1.11.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env: []
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        args:
        - --web.listen-address=:8080
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id001
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: dr-lab
  labels:
    observe: app
spec:
  selector:
    app: pushgateway
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: dr-lab
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: &id001
      app: postgres-exporter
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres-exporter
        image: prometheuscommunity/postgres-exporter:v0.17.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: DATA_SOURCE_URI
          value: active-db:5432/app?sslmode=disable
        - name: DATA_SOURCE_USER
          value: app
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        args:
        - --web.listen-address=:8080
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id001
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: dr-lab
  labels:
    observe: app
spec:
  selector:
    app: postgres-exporter
  ports:
  - name: http
    port: 8080
    targetPort: http
