name: disaster-recovery-platform
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/init-secrets.sh}
    volumes:
    - db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U app -d app
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: .
      args:
        SERVICE: app
    image: disaster-recovery-platform-app:dev
    environment:
      PGHOST: db
      DB_PASSWORD: ${DB_PASSWORD}
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    command:
    - python
    - migrate.py
    depends_on:
      db:
        condition: service_healthy
  app:
    build:
      context: .
      args:
        SERVICE: app
    image: disaster-recovery-platform-app:dev
    environment:
      SERVICE: app
      ENVIRONMENT: local
      PGHOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz',timeout=4)
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:8094:8080
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
    - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 127.0.0.1:9093:9090
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run scripts/init-secrets.sh}
    volumes:
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
    - 127.0.0.1:3012:3000
volumes:
  db: {}
