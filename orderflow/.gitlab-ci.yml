stages: [test, build, deploy]

unit:
  stage: test
  image: python:3.13-slim
  script:
    - python -m unittest discover -s tests -p 'test_*.py' -v
    - python -m compileall -q app tests

terraform:
  stage: test
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: ['']
  script:
    - terraform -chdir=terraform fmt -check
    - terraform -chdir=terraform init -backend=false
    - terraform -chdir=terraform validate

ansible:
  stage: test
  image: python:3.13-slim
  script:
    - pip install ansible-core==2.18.6
    - ansible-playbook -i ansible/inventory.ini.example ansible/playbook.yml --syntax-check
    - for file in scripts/*.sh; do bash -n "$file" || exit 1; done

build_and_integration:
  stage: build
  image: docker:28.3.3-cli
  services:
    - name: docker:28.3.3-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - apk add --no-cache bash openssl python3
    - bash scripts/init-secrets.sh
  script:
    - docker compose up -d --build --wait --wait-timeout 180
    # Run inside the API container: published localhost ports belong to the DinD service.
    - docker compose exec -T -e BASE_URL=http://localhost:8080 api sh -c 'API_TOKEN=$(cat /run/secrets/api_token) python /app/smoke.py'
    - bash scripts/backup.sh > /tmp/backup-path
    - bash scripts/restore-check.sh "$(cat /tmp/backup-path)"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker tag orderflow:dev "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  after_script:
    - docker compose logs --tail=50
    - docker compose down -v

deploy_staging:
  stage: deploy
  tags: [orderflow-deploy]
  resource_group: orderflow-staging
  environment:
    name: staging
  variables:
    IMAGE: '$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA'
  script:
    - export KUBECONFIG="$KUBE_CONFIG"
    - bash scripts/deploy.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
